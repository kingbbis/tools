<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {font-family: Arial, sans-serif;background:#f0f0f0;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}
        .calc-container {background:#fff;padding:15px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);width:min(350px,85vw);}
        h1{text-align:center;margin-bottom:12px;font-size:20px;}
        #display {width:100%;padding:10px;font-size:20px;margin-bottom:8px;border:1px solid #ccc;border-radius:5px;text-align:right;}
        .buttons {display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
        button{padding:12px;font-size:16px;border:none;border-radius:5px;background:#ececec;cursor:pointer;transition:.15s;}
        button:hover{background:#d6d6d6;}
        .operator{background:#f7b731;color:#fff;}
        .operator:hover{background:#e89f21;}
        .wide{grid-column:span 2;}
        .sub-section{margin-top:12px;padding:10px;border:1px solid #ddd;border-radius:6px;background:#fafafa;}
        .sub-section label{display:block;margin:.2rem 0;font-weight:600;font-size:14px;}
        .sub-section input{width:100%;padding:6px;margin-top:4px;border:1px solid #ccc;border-radius:4px;font-size:14px;}
        .result{margin-top:6px;font-size:14px;font-weight:700;}
        .back-home{position:fixed;top:12px;left:12px;padding:8px 14px;border:none;border-radius:5px;background-color:#2196F3;color:white;cursor:pointer;}
        .back-home:hover{background-color:#0b7dda;}
    </style>
</head>
<body>
    <button class="back-home" onclick="window.location.href='index.html'">Back to Home</button>
    <div class="calc-container">
        <h1>Calculator</h1>
        <input id="display" type="text" readonly value="0">
        <div class="buttons">
            <button onclick="append('7')">7</button><button onclick="append('8')">8</button><button onclick="append('9')">9</button><button class="operator" onclick="append('/')">÷</button>
            <button onclick="append('4')">4</button><button onclick="append('5')">5</button><button onclick="append('6')">6</button><button class="operator" onclick="append('*')">×</button>
            <button onclick="append('1')">1</button><button onclick="append('2')">2</button><button onclick="append('3')">3</button><button class="operator" onclick="append('-')">−</button>
            <button onclick="append('0')">0</button><button onclick="append('.')">.</button><button onclick="calculate()" class="operator">=</button><button class="operator" onclick="append('+')">+</button>
            <button class="operator" onclick="clearDisplay()">C</button><button onclick="applyPercent()">%</button><button onclick="applySqrt()">√</button><button onclick="applyPow()">x²</button>
        </div>

        <div class="sub-section">
            <label>Algebra: solve linear ax + b = 0</label>
            <input id="alg-a" type="number" placeholder="a" value="1">
            <input id="alg-b" type="number" placeholder="b" value="0" style="margin-top:6px;">
            <button style="margin-top:8px;width:100%;" onclick="solveLinear()">Solve</button>
            <div id="alg-result" class="result"></div>
        </div>

        <div class="sub-section">
            <label>Polynomials: quadratic ax² + bx + c = 0</label>
            <input id="poly-a" type="number" placeholder="a" value="1">
            <input id="poly-b" type="number" placeholder="b" value="0" style="margin-top:6px;">
            <input id="poly-c" type="number" placeholder="c" value="0" style="margin-top:6px;">
            <button style="margin-top:8px;width:100%;" onclick="solveQuadratic()">Solve</button>
            <div id="poly-result" class="result"></div>
        </div>

        <div class="sub-section">
            <label>Coordinates: Input as x1,y1;x2,y2</label>
            <input id="coord-input" type="text" placeholder="e.g. 1,2;3,4">
            <button style="margin-top:8px;width:100%;" onclick="processCoordinates()">Compute Distance + Midpoint</button>
            <div id="coord-result" class="result"></div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
